<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studrio Booth — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

  <!-- ── Top bar ─────────────────────────────────────────────────────────── -->
  <header class="admin-topbar">
    <div class="admin-topbar-inner">
      <span class="admin-logo">Studrio Booth <span class="admin-logo-tag">Staff Control Room</span></span>
      <nav class="admin-tabs" id="adminTabs">
        <button class="admin-tab active" data-tab="stats">Overview</button>
        <button class="admin-tab"        data-tab="sessions">Sessions</button>
        <button class="admin-tab"        data-tab="templates">Templates</button>
        <button class="admin-tab"        data-tab="printer">Printer</button>
      </nav>
      <button class="btn-admin btn-admin-ghost btn-sm" id="btnSignOut">Sign out</button>
    </div>
  </header>

  <!-- ── Main content ─────────────────────────────────────────────────────── -->
  <main class="admin-main">

    <!-- ── Overview tab ───────────────────────────────────────────────────── -->
    <section class="admin-panel active" data-panel="stats">
      <div class="stat-grid">
        <div class="stat-card">
          <p class="stat-label">Photo strips taken</p>
          <div class="stat-odometer" id="statStrips">—</div>
        </div>
        <div class="stat-card">
          <p class="stat-label">Copies printed</p>
          <div class="stat-odometer" id="statCopies">—</div>
        </div>
        <div class="stat-card">
          <p class="stat-label">Storage used</p>
          <div class="stat-odometer" id="statStorage">—</div>
        </div>
      </div>
    </section>

    <!-- ── Sessions tab ───────────────────────────────────────────────────── -->
    <section class="admin-panel" data-panel="sessions">

      <!-- Date filter pills -->
      <div class="date-filter-row" id="dateFilterRow"></div>

      <div class="gallery-section-head">
        <div class="gallery-section-head-left">
          <h2>Sessions</h2>
          <p class="gallery-count" id="sessionCount"></p>
        </div>
        <button class="btn-admin btn-admin-outline btn-sm" id="btnSelectSessions">Select</button>
      </div>

      <!-- Bulk action bar (shown in select mode) -->
      <div class="bulk-bar" id="bulkBar" hidden>
        <span class="bulk-count" id="bulkCount">0 selected</span>
        <button class="btn-admin btn-admin-danger btn-sm" id="btnDeleteSelected">Delete Selected</button>
        <button class="btn-admin btn-admin-ghost btn-sm" id="btnCancelSelect">Cancel</button>
      </div>

      <p class="admin-status" id="sessionStatus">Loading sessions…</p>
      <div class="session-grid" id="sessionGrid"></div>

      <!-- Single/batch delete confirmation modal -->
      <div class="admin-modal-overlay" id="deleteModal" hidden>
        <div class="admin-modal-box">
          <p class="admin-modal-message" id="deleteModalMessage">
            Delete this session? This cannot be undone.
          </p>
          <div class="admin-modal-actions">
            <button class="btn-admin btn-admin-outline" id="btnDeleteCancel">Cancel</button>
            <button class="btn-admin btn-admin-danger" id="btnDeleteConfirm">Delete</button>
          </div>
        </div>
      </div>

    </section>

    <!-- ── Templates tab ──────────────────────────────────────────────────── -->
    <section class="admin-panel" data-panel="templates">

      <!--
        The Template Manager injects all its own HTML into #templateSection.
        admin-template-manager.js calls templateManager.init() which calls
        injectHTML() filling this container, then wires up events and loads.
      -->
      <div id="templateSection"></div>

    </section>

    <!-- ── Printer tab ────────────────────────────────────────────────────── -->
    <section class="admin-panel" data-panel="printer">

      <h2>Printer Setup</h2>

      <!-- Agent status -->
      <div class="printer-status-row">
        <span class="printer-agent-dot" id="printerAgentDot"></span>
        <span class="printer-agent-label" id="printerAgentLabel">Checking agent…</span>
      </div>

      <!-- Printer selector -->
      <div class="form-field" id="printerSelectorWrap" hidden>
        <label for="printerSelect">Target printer</label>
        <select id="printerSelect">
          <option value="">— Select a printer —</option>
        </select>
        <button class="btn-admin btn-admin-primary" id="btnSavePrinter">Save</button>
      </div>

      <!-- Alignment sliders -->
      <div class="alignment-section" id="alignmentSection" hidden>
        <h3>Print Alignment</h3>

        <div class="form-field">
          <label for="alignScale">Scale — <span id="alignScaleVal">100</span>%</label>
          <input type="range" id="alignScale" min="80" max="100" step="1" value="100">
        </div>

        <div class="form-field">
          <label for="alignX">Horizontal offset — <span id="alignXVal">0</span> px</label>
          <input type="range" id="alignX" min="-200" max="200" step="1" value="0">
        </div>

        <div class="form-field">
          <label for="alignY">Vertical offset — <span id="alignYVal">0</span> px</label>
          <input type="range" id="alignY" min="-200" max="200" step="1" value="0">
        </div>

        <div class="printer-actions">
          <button class="btn-admin btn-admin-outline" id="btnSaveAlignment">Save alignment</button>
          <button class="btn-admin btn-admin-primary" id="btnTestPrint">Test Print</button>
        </div>
      </div>

    </section>

  </main>

  <!-- ── Toast ────────────────────────────────────────────────────────────── -->
  <div class="admin-toast" id="adminToast" hidden></div>

  <!-- ── Scripts ──────────────────────────────────────────────────────────── -->
  <!--
    Load order matters:
      1. Supabase SDK  — required by cloud-storage.js
      2. cloud-storage.js — provides adminStorage + adminTemplates
      3. admin-template-manager.js — depends on adminTemplates
      4. admin-dashboard.js — ties everything together; calls templateManager.init()
  -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../js/cloud-storage.js"></script>
  <script src="../js/admin-template-manager.js"></script>
  <script src="../js/admin-dashboard.js"></script>
</body>
</html>
