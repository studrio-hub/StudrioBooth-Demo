<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: electron: https://oismyjlhnlfavrdfvabg.supabase.co; connect-src 'self' https://oismyjlhnlfavrdfvabg.supabase.co;">
<title>Studrio Booth — Admin Sign In</title>
<!-- Asset paths are relative: this file lives at /admin/index.html,
     so CSS and JS are one level up (../css/, ../js/). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body>

<!-- ===================== LOGIN SCREEN ===================== -->
<!-- This is its own page now — signing in navigates straight to
     dashboard.html rather than swapping a hidden section in place. -->
<div id="adminLogin" class="admin-login-screen">
  <form id="loginForm" class="login-card">
    <p class="login-eyebrow">STUDRIO BOOTH — STAFF ONLY</p>
    <h1 class="login-title">Control Room</h1>

    <label class="login-field">
      <span>Email</span>
      <input type="email" id="loginEmail" required autocomplete="username">
    </label>
    <label class="login-field">
      <span>Password</span>
      <input type="password" id="loginPassword" required autocomplete="current-password">
    </label>

    <button type="submit" class="btn-admin btn-admin-primary" id="loginSubmitBtn">Sign in</button>
    <p class="login-error" id="loginError" hidden></p>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../js/cloud-storage.js"></script>
<script src="../js/admin-login.js"></script>
</body>
</html>
