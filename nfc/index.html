<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: electron: https://oismyjlhnlfavrdfvabg.supabase.co; connect-src 'self' https://oismyjlhnlfavrdfvabg.supabase.co;">
<title>Studrio Booth — Unlock</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #1c1e21;
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  .card {
    background: #2a2d31;
    border-radius: 20px;
    padding: 2.4rem 2rem;
    max-width: 360px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  .icon {
    font-size: 3.5rem;
    margin-bottom: 1.2rem;
    display: block;
  }
  h1 {
    font-size: 1.4rem;
    font-weight: 800;
    margin-bottom: 0.5rem;
    letter-spacing: -0.01em;
  }
  p {
    font-size: 0.9rem;
    color: #9aa0aa;
    line-height: 1.6;
    margin-bottom: 1.6rem;
  }
  .status {
    background: #1c1e21;
    border-radius: 12px;
    padding: 1.2rem;
    font-size: 0.95rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.8rem;
    min-height: 60px;
  }
  .status.loading { color: #f0c231; }
  .status.success { color: #1fae63; }
  .status.error   { color: #e0403f; }
  .spinner {
    width: 20px; height: 20px;
    border: 3px solid rgba(240,194,49,0.2);
    border-top-color: #f0c231;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .logo {
    margin-top: 2rem;
    font-size: 0.75rem;
    color: #666;
    letter-spacing: 0.15em;
    font-weight: 700;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="card">
  <span class="icon">🔓</span>
  <h1>Unlock Kiosk</h1>
  <p>This page unlocks the Studrio Booth kiosk. Keep it open until the kiosk confirms.</p>
  <div class="status loading" id="status">
    <div class="spinner" id="spinner"></div>
    <span id="statusText">Connecting…</span>
  </div>
  <p class="logo">Studrio Booth</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  // ── Config (same anon key as the kiosk) ──────────────────────────────────
  const SUPABASE_URL  = "https://oismyjlhnlfavrdfvabg.supabase.co";
  const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9pc215amxobmxmYXZyZGZ2YWJnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwMTI3OTMsImV4cCI6MjEwMDU4ODc5M30.TLGFzBFDYJsWUErTVV8yP2SlpkL9LzEPoFKV2R3hBGE";

  // ── Read token from URL: studrio.cc/nfc/?token=<value>  ─────────────────
  const params = new URLSearchParams(window.location.search);
  const token  = params.get("token");

  const statusEl = document.getElementById("status");
  const textEl   = document.getElementById("statusText");
  const spinner  = document.getElementById("spinner");

  function setStatus(type, msg) {
    statusEl.className = "status " + type;
    textEl.textContent = msg;
    if (type !== "loading") spinner.style.display = "none";
  }

  async function run() {
    if (!token) {
      setStatus("error", "No token in URL. Tap the NFC tag again.");
      return;
    }

    let client;
    try {
      client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
    } catch (e) {
      setStatus("error", "Could not connect. Check your internet.");
      return;
    }

    setStatus("loading", "Unlocking kiosk…");

    try {
      const { error } = await client.from("nfc_tokens").insert({
        token: token,
        // expires_at defaults to NOW() + 5 min in the DB
      });

      if (error) {
        // Duplicate key = token already issued (e.g. page reloaded)
        if (error.code === "23505") {
          setStatus("success", "✓ Already unlocked — check the kiosk.");
        } else {
          throw error;
        }
        return;
      }

      setStatus("success", "✓ Kiosk unlocked! You can close this page.");
    } catch (e) {
      console.error(e);
      setStatus("error", "Failed: " + (e.message || "Unknown error"));
    }
  }

  run();
</script>
</body>
</html>
