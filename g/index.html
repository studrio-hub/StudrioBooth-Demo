<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://gbhsitdxorjocsetueul.supabase.co; media-src 'self' blob: https://gbhsitdxorjocsetueul.supabase.co; connect-src 'self' https://gbhsitdxorjocsetueul.supabase.co;">
<title>The Gallery — Studrio Booth</title>
<!-- This file lives at /g/index.html — CSS is one level up. -->
<link rel="stylesheet" href="../css/gallery.css">
</head>
<body>

<div id="galleryPage">

  <!-- Top bar: title left, logo right -->
  <header class="gallery-topbar">
    <h1 class="gallery-title">The Gallery</h1>
    <img
      class="gallery-logo"
      src="../assets/designs/Logo_White.png"
      alt="Studrio Booth"
      onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"
    >
    <span class="gallery-logo-text" style="display:none;">Studrio</span>
  </header>

  <!-- Carousel wrapper — fills the viewport between topbar and filmstrip -->
  <div class="gallery-carousel-wrap">

    <!-- Left / right nav arrows -->
    <button class="gallery-nav-arrow gallery-nav-prev" id="galleryNavPrev" hidden aria-label="Previous">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </button>
    <button class="gallery-nav-arrow gallery-nav-next" id="galleryNavNext" hidden aria-label="Next">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18l6-6-6-6"/>
      </svg>
    </button>

    <!-- Horizontal scroll-snap carousel — slides injected by gallery.js -->
    <div class="gallery-carousel" id="galleryCarousel"></div>

    <!-- Expiry note — floated above filmstrip -->
    <div class="gallery-expiry-badge">
      ⏱ Photos available for 72 hours
    </div>

    <!-- Loading state -->
    <div id="galleryLoading" class="gallery-status">
      <div class="gallery-loading-spinner"></div>
      <span>Loading your gallery…</span>
    </div>

    <!-- Not-found state -->
    <div id="galleryNotFound" class="gallery-not-found" hidden>
      <span class="gallery-not-found-icon">📷</span>
      <p class="gallery-not-found-title">Gallery not found</p>
      <p class="gallery-not-found-body">
        We couldn't find this gallery. The link may have expired or the session
        may not have finished uploading yet — try scanning the QR code again.
      </p>
    </div>

  </div><!-- /.gallery-carousel-wrap -->

  <!-- Filmstrip thumbnails — gallery.js injects .gallery-thumb items -->
  <div class="gallery-filmstrip" id="galleryFilmstrip"></div>

  <!-- Toast notification -->
  <p id="galleryToast" class="gallery-toast"></p>

  <!-- Footer (hidden in carousel layout; kept for graceful fallback) -->
  <footer class="gallery-footer">
    <p>Powered by Studrio Booth</p>
  </footer>

</div><!-- /#galleryPage -->

<!-- Supabase + gallery logic -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../js/cloud-storage.js"></script>
<script src="../js/gallery.js"></script>

</body>
</html>
