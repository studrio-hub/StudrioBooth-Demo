<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Digital Copy — Studrio Booth</title>
<link rel="stylesheet" href="css/gallery.css">
</head>
<body>

<div id="galleryPage">

  <header class="gallery-header">
    <h1>Your Digital Copy</h1>
    <p class="gallery-sub">Studrio Booth</p>
  </header>

  <main class="gallery-main">

    <section class="gallery-block gallery-block-full gallery-preview-block">
      <div class="gallery-media-frame" id="galleryStripContainer">
        <button class="gallery-mute-toggle" id="galleryMuteToggle" hidden aria-label="Unmute video">🔇</button>
      </div>

      <div class="gallery-download-row">
        <button class="gallery-download-toggle" id="btnDownloadPhoto" hidden>
          <span class="gallery-download-icon">🖼</span>
          <span class="gallery-download-labels">
            <span class="gallery-download-title">Download Photo</span>
            <span class="gallery-download-subtitle">Save the photo strip</span>
          </span>
        </button>
        <button class="gallery-download-toggle" id="btnDownloadVideo" hidden>
          <span class="gallery-download-icon">▶</span>
          <span class="gallery-download-labels">
            <span class="gallery-download-title">Download Video</span>
            <span class="gallery-download-subtitle">Save the video strip</span>
          </span>
        </button>
      </div>
    </section>

  </main>

  <p id="galleryLoading" class="gallery-status">Loading your gallery...</p>
  <p id="galleryNotFound" class="gallery-status" hidden>
    We couldn't find this gallery. If you're testing locally, open this link
    on the same device/browser where the session was created.
  </p>
  <p id="galleryToast" class="gallery-toast" hidden></p>

  <footer class="gallery-footer">
    <p>Powered by Studrio Booth</p>
  </footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/cloud-storage.js"></script>
<script src="js/gallery.js"></script>
</body>
</html>
